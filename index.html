<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real CEO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 24px 20px;
            border-radius: 0 0 24px 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 6px 0 0;
            opacity: 0.7;
        }

        .container {
            padding: 18px;
        }

        .card {
            background: white;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .card-title {
            font-size: 14px;
            color: #6b7280;
        }

        .amount {
            font-size: 25px;
            font-weight: bold;
            margin-top: 6px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .menu button {
            border: none;
            background: white;
            padding: 20px 10px;
            border-radius: 18px;
            font-size: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            cursor: pointer;
        }

        .menu button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>REAL CEO 👔</h1>
        <p>Real Choyxona M39</p>
    </div>

    <div class="container">

        <div class="card">
            <div class="card-title">💰 Bugungi tushum</div>
            <div class="amount">0 so'm</div>
        </div>

        <div class="card">
            <div class="card-title">💸 Bugungi xarajat</div>
            <div class="amount">0 so'm</div>
        </div>

        <div class="card">
            <div class="card-title">📈 Bugungi foyda</div>
            <div class="amount">0 so'm</div>
        </div>

        <div class="menu">

            <button>💰<br>Daromad</button>

            <button>💸<br>Xarajatlar</button>

            <button>📦<br>Ombor</button>

            <button>👥<br>Xodimlar</button>

            <button>🍽️<br>Savdo</button>

            <button>📊<br>Hisobot</button>

            <button>🤖<br>AI CEO</button>

            <button>⚙️<br>Sozlamalar</button>

        </div>

    </div>

</body>
</html>
