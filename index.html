<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real CEO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #111827;
        }

        .header {
            background: #111827;
            color: white;
            padding: 24px 20px;
            border-radius: 0 0 24px 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 7px 0 0;
            opacity: 0.75;
        }

        .container {
            padding: 18px;
            max-width: 600px;
            margin: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .title {
            font-size: 14px;
            color: #6b7280;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
            margin-top: 7px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 6px;
        }

        button {
            border: none;
            background: white;
            padding: 20px 10px;
            border-radius: 18px;
            font-size: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        .primary {
            background: #111827;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 22px;
            border-radius: 22px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>REAL CEO 👔</h1>
    <p>Real Choyxona M39</p>
</div>

<div class="container">

    <div class="stats">

        <div class="card">
            <div class="title">💰 Daromad</div>
            <div class="amount" id="income">0 so'm</div>
        </div>

        <div class="card">
            <div class="title">💸 Xarajat</div>
            <div class="amount" id="expense">0 so'm</div>
        </div>

    </div>

    <div class="card">
        <div class="title">📈 Foyda</div>
        <div class="amount" id="profit">0 so'm</div>
    </div>

    <div class="menu">

        <button class="primary" onclick="openModal('income')">
            💰<br>Daromad qo‘shish
        </button>

        <button onclick="openModal('expense')">
            💸<br>Xarajat qo‘shish
        </button>

        <button>
            📦<br>Ombor
        </button>

        <button>
            👥<br>Xodimlar
        </button>

        <button>
            🍽️<br>Savdo
        </button>

        <button>
            📊<br>Hisobot
        </button>

        <button>
            🤖<br>AI CEO
        </button>

        <button>
            ⚙️<br>Sozlamalar
        </button>

    </div>

</div>

<div class="modal" id="modal">

    <div class="modal-content">

        <h2 id="modalTitle">Daromad qo‘shish</h2>

        <input
            type="number"
            id="amount"
            placeholder="Summa, masalan: 500000"
        >

        <input
            type="text"
            id="description"
            placeholder="Izoh"
        >

        <div class="modal-buttons">

            <button onclick="closeModal()">
                Bekor qilish
            </button>

            <button class="primary" onclick="saveData()">
                Saqlash
            </button>

        </div>

    </div>

</div>

<script>
let currentType = "";

const API_URL = "/api";

function openModal(type) {
    currentType = type;

    document.getElementById("modal").style.display = "flex";

    document.getElementById("modalTitle").innerText =
        type === "income"
            ? "💰 Daromad qo‘shish"
            : "💸 Xarajat qo‘shish";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
    document.getElementById("amount").value = "";
    document.getElementById("description").value = "";
}

function formatMoney(value) {
    return Number(value).toLocaleString("uz-UZ") + " so‘m";
}

// PostgreSQL bazasidan hisobotni olish
async function loadDashboard() {
    try {
        const response = await fetch(API_URL + "/summary");

        if (!response.ok) {
            throw new Error("Hisobotni olishda xatolik");
        }

        const data = await response.json();

        document.getElementById("income").innerText =
            formatMoney(data.income);

        document.getElementById("expense").innerText =
            formatMoney(data.expense);

        document.getElementById("profit").innerText =
            formatMoney(data.profit);

    } catch (error) {
        console.error(error);
        alert("Serverdan ma'lumot olishda xatolik yuz berdi.");
    }
}

// Daromad yoki xarajatni PostgreSQL bazasiga saqlash
async function saveData() {
    const amount = Number(
        document.getElementById("amount").value
    );

    const description =
        document.getElementById("description").value.trim();

    if (!Number.isFinite(amount) || amount <= 0) {
        alert("Iltimos, to‘g‘ri summani kiriting.");
        return;
    }

    const saveButton =
        document.querySelector(".modal-buttons .primary");

    saveButton.disabled = true;
    saveButton.innerText = "Saqlanmoqda...";

    try {
        const response = await fetch(
            API_URL + "/transactions",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    type: currentType,
                    amount: amount,
                    description: description
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.error || "Saqlashda xatolik"
            );
        }

        closeModal();

        await loadDashboard();

        alert("Ma'lumot muvaffaqiyatli saqlandi!");

    } catch (error) {
        alert("Xatolik: " + error.message);
    } finally {
        saveButton.disabled = false;
        saveButton.innerText = "Saqlash";
    }
}

// Sahifa ochilganda ma'lumotlarni yuklash
document.addEventListener(
    "DOMContentLoaded",
    loadDashboard
);
</script>

</body>
</html>
